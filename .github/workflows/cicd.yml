name: CI/CD com aprovação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Teste - páginas existem
        run: test -f site/index.html && test -f site/projetos.html

      - name: Teste - páginas têm título
        run: grep -q "<title>" site/index.html && grep -q "<title>" site/projetos.html

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  aprovacao:
    name: Aprovação manual
    needs: build-test
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - run: echo "Aprovado por ${{ github.actor }}"

  deploy:
    name: Deploy no GitHub Pages
    needs: aprovacao
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
